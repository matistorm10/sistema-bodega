name: Respaldo diario de archivos adjuntos

on:
  schedule:
    - cron: '0 8 * * *'   # todos los días a las 08:00 UTC (~05:00 hora Chile)
  workflow_dispatch: {}   # también se puede correr manualmente desde GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configurar conexión a Supabase y Backblaze
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [supabase]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.SUPABASE_S3_ENDPOINT }}
          region = ${{ secrets.SUPABASE_S3_REGION }}
          force_path_style = true

          [b2]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.B2_KEY_ID }}
          secret_access_key = ${{ secrets.B2_APP_KEY }}
          endpoint = ${{ secrets.B2_ENDPOINT }}
          region = ${{ secrets.B2_REGION }}
          force_path_style = true
          EOF

      - name: Copiar archivos nuevos/modificados hacia el respaldo
        run: |
          rclone copy supabase:movimientos b2:${{ secrets.B2_BUCKET_NAME }}/movimientos --progress -vv
